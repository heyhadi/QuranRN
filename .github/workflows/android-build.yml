name: Android APK

# Builds an installable APK straight from the repo — no EAS quota involved.
# Publishes it as a GitHub Release asset (wird-android.apk), so the landing
# page's "latest release" download button always serves the newest build.
# Runs on every push to main that touches app code, and manually.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'store/**'
      - 'constants/**'
      - 'assets/**'
      - 'locales/**'
      - 'i18n/**'
      - 'plugins/**'
      - 'native-modules/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# One release build at a time. A newer push cancels the build still running, so an older build can
# never finish last and become the "latest" release that the in-app updater offers.
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle's downloads and build outputs between runs; without it every run rebuilt all
      # ~1000 tasks from scratch.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stamp build version
        id: stamp
        run: |
          VERSION=$(python3 -c "
          import json
          run = int('${{ github.run_number }}')
          with open('app.json') as f: cfg = json.load(f)
          major, minor = cfg['expo']['version'].split('.')[:2]
          version = f'{major}.{minor}.{run}'
          cfg['expo']['version'] = version
          cfg['expo'].setdefault('android', {})['versionCode'] = run
          with open('app.json', 'w') as f: json.dump(cfg, f, indent=2)
          with open('package.json') as f: pkg = json.load(f)
          pkg['version'] = version
          with open('package.json', 'w') as f: json.dump(pkg, f, indent=2)
          print(version, end='')
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stamped version $VERSION (versionCode ${{ github.run_number }})"

      - name: Install dependencies
        run: npm ci

      # Every build is offered to users through the in-app updater, so a broken commit must not ship.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Decode release keystore (if configured)
        # Secrets come in through env, not pasted into the script text.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wird.p12"
            echo "WIRD_KEYSTORE_FILE=$RUNNER_TEMP/wird.p12" >> "$GITHUB_ENV"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Release keystore configured; will build a signed release APK"
          else
            echo "No keystore secrets configured; will build a debug APK"
          fi

      - name: Expo prebuild (generate android/ with config plugins)
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1
          WIRD_KEYSTORE_FILE: ${{ runner.temp }}/wird.p12
          WIRD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WIRD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WIRD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 64-bit ARM only: it's what the app supports (see the README and website) and what EAS builds.
      # Compiling all four ABIs took most of the build time and doubled the APK size.
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          TASK=assembleDebug
          if [ "${HAS_KEYSTORE:-}" = "true" ]; then TASK=assembleRelease; fi
          ./gradlew "$TASK" --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
        env:
          CI: 1
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Prepare APK
        id: apk
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk wird-android.apk
            echo "Built signed release APK"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk wird-android.apk
            echo "Built debug APK (no signing secrets configured)"
          fi
          ls -lh wird-android.apk
          SHA=$(sha256sum wird-android.apk | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$(du -m wird-android.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wird-android
          path: wird-android.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The trailing -<versionCode> is what the in-app updater reads (services/update.ts). Builds up
          # to 15 only understand this form, so keep it even though the version ends in the same number.
          tag_name: v${{ steps.stamp.outputs.version }}-${{ github.run_number }}
          name: Wird Android v${{ steps.stamp.outputs.version }}
          body: |
            Automated Android build from main (${{ github.sha }}).
            Download `wird-android.apk` (about ${{ steps.apk.outputs.size }} MB) and install it on your phone (Android 7 or newer, 64-bit ARM).

            SHA-256 of `wird-android.apk`:
            ```
            ${{ steps.apk.outputs.sha256 }}
            ```
            Check it on a Mac or Linux with `shasum -a 256 wird-android.apk`.
          files: wird-android.apk
